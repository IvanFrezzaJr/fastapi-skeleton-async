[project]
name = "fastapi-skeleton-sync"
version = "0.1.0"
description = ""
authors = [
    { name = "IvanFrezzaJr", email = "ivanfrezza@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.115.3,<0.116.0",
    "pydantic[email]>=2.9.2,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "pwdlib[argon2]>=0.2.1,<1.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "python-multipart>=0.0.16,<1.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "gunicorn>=26.0.0",
    "uvicorn-worker>=0.4.0",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.1,<1.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "taskipy>=1.14.0,<2.0.0",
    "testcontainers>=4.8.2,<5.0.0",
    "toolong>=1.5.0,<2.0.0",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.22.1",
    "pre-commit>=4.6.1",
    "mypy>=2.3.0",
]


[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:warnings"
asyncio_mode = "auto"  # avoid to add @pytest.mark.asyncio in all tests


[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]


[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "W", "PL", "PT"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "migrations",
]


[tool.ruff.format]
preview = true
quote-style = "single"


[tool.taskipy.tasks]
run = "fastapi dev app/main.py"
lint = "ruff check . && ruff format --check ."
format = "ruff check . --fix && ruff format ."

pre_test = "task lint"
test = "pytest --cov=app -vv"
post_test = "coverage html"
