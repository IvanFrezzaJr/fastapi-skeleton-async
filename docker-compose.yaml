services:
  database:
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: app
    build:
      context: .
      target: development
    entrypoint: ./scripts/entrypoint.sh
    volumes:
      - .:/app
      - /app/.venv  # protect .venv inside of the container
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app_user:app_password@database:5432/app_db

volumes:
  pgdata: